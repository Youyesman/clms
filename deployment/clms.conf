<VirtualHost *:80>
    ServerName castingline.co.kr
    ServerAlias www.castingline.co.kr castingline.kro.kr

    # ACME 챌린지(인증서 발급/갱신)만 예외로 두고 전부 HTTPS로 리다이렉트
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://castingline.co.kr%{REQUEST_URI} [R=301,L]

    DocumentRoot /home/clms/castingline_frontend/build
</VirtualHost>

<VirtualHost *:443>
    ServerName castingline.co.kr
    ServerAlias www.castingline.co.kr

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/castingline.co.kr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/castingline.co.kr/privkey.pem

    # 백엔드(Django)가 https 요청임을 알 수 있도록 전달
    RequestHeader set X-Forwarded-Proto "https"

    # 1. 프록시 설정을 최상단으로 이동 및 구문 수정
    ProxyPreserveHost On
    ProxyRequests Off

    # Gunicorn 소켓 연결 (대소문자 무관하게 매칭되도록 Location 사용)
    <Location /Api>
        ProxyPass unix:/run/gunicorn/clms.sock|http://localhost/Api
        ProxyPassReverse unix:/run/gunicorn/clms.sock|http://localhost/Api
    </Location>

    <Location /admin>
        ProxyPass unix:/run/gunicorn/clms.sock|http://localhost/admin
        ProxyPassReverse unix:/run/gunicorn/clms.sock|http://localhost/admin
    </Location>

    # 2. Frontend 설정
    DocumentRoot /home/clms/castingline_frontend/build
    <Directory /home/clms/castingline_frontend/build>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted

        # 진입 파일(index.html 등 해시 없는 파일)은 항상 재검증 → 새 배포 즉시 반영
        # (ETag/Last-Modified 로 변경 없으면 304, 바뀌면 새 번들 참조를 받음)
        <IfModule mod_headers.c>
            Header set Cache-Control "no-cache, must-revalidate"
        </IfModule>

        # React SPA 설정
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        # /Api 나 /admin 으로 시작하는 요청은 Rewrite에서 제외
        RewriteCond %{REQUEST_URI} !^/Api/
        RewriteCond %{REQUEST_URI} !^/admin/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-l
        RewriteRule . /index.html [L]
    </Directory>

    # 해시가 박힌 정적 자원(/static/js/main.<hash>.js 등)은 1년 불변 캐시
    # 파일명 해시가 바뀌면 새 URL이 되므로 stale 위험 없음
    <Directory /home/clms/castingline_frontend/build/static>
        <IfModule mod_headers.c>
            Header set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </Directory>

    # Static/Media 설정
    Alias /django_static/ /home/clms/castingline_backend/static/
    Alias /media/ /home/clms/castingline_backend/media/

    ErrorLog ${APACHE_LOG_DIR}/clms_error.log
    CustomLog ${APACHE_LOG_DIR}/clms_access.log combined
</VirtualHost>
